# Welcome Directs Schedule


# Use the following format to define entries:
#
# ---
# # Unique entry id
# id: entry_id
#
# # (optional) If set, the delay will be counted from the midnight of the next
# # skipDays'st day, i.e. "1" means the next day midnight. If not set, the delay
# # will be counted from the user's first interaction with FreeFeed
# skipDays: 1
#
# # (optional) Delay before sending the direct message, in ISO 8601 duration
# # format, or no delay if not set.
# delay: "PT1H"
#
# # (optional) Criterion to check before sending the direct message. If not set,
# # just send the direct message.
# criterion:
#   # Criterion type, required. Only "noPosts" and "noSubscriptions" are supported
#   # for now.
#   type: noPosts
#   # (optional) Criterion arguments
#
# body: >
#   The message body
#
# comment: >
#   The comment, optional
#

---
id: greeting_at_start
body: >
  Hi and welcome to FreeFeed!
  I am a welcome bot and this is your personal welcome message.
comment: >
  Please ask in @support group for help

---
id: no_posts
delay: "PT10M"
criterion:
  type: noPosts
body: >
  Hello again, I see you haven't created any posts in the last 10 minutes!
comment: >
  Don't worry, you can create posts at any time.

---
id: no_subscriptions
skipDays: 1 # If set, the delay will be counted from the midnight of the next skipDays'st day
delay: "PT10H"
criterion:
  type: noSubscriptions
  maxSubscriptions: 2
  ignore: ["welcome", "ruwelcome", "irwelcome", "freefeed", "support"]
body: >
  Hi, I see you haven't subscribed to anyone yet.
